[project]
name = "piphi-network-zigbee"
version = "0.1.5"
description = "PiPhi Network Zigbee integration runtime."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "paho-mqtt>=2.1.0",
  "uvicorn[standard]>=0.30.0",
  "piphi-runtime-kit-python>=0.7.1,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]


binary = [
  "pyinstaller>=6.10.0",
]

[project.scripts]
piphi_network_zigbee = "piphi_network_zigbee.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piphi_network_zigbee"]
