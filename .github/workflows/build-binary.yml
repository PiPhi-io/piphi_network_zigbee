name: Build Binary

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-binary:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev,binary]
      - run: python scripts/validate.py
      - run: pytest
      - run: python scripts/build_binary.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: piphi-network-zigbee-${{ runner.os }}-${{ runner.arch }}
          path: dist/binary/*
          if-no-files-found: error
